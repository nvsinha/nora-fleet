---
name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      # v6.0.2
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # nora-common is a PRIVATE repo pulled in over https by pip. The runner
      # has no credentials for it, so rewrite github.com URLs to carry a token.
      # Remove this step once the Nora repos are public.
      - name: Authenticate for private Nora dependencies
        env:
          NORA_REPOS_TOKEN: ${{ secrets.NORA_REPOS_TOKEN }}
        run: |
          if [ -z "$NORA_REPOS_TOKEN" ]; then
            echo "::error::NORA_REPOS_TOKEN is not set. See CONTRIBUTING.md."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${NORA_REPOS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Lint (pylint)
        run: build_scripts/run_pylint.sh

      - name: Lint (flake8)
        run: flake8

      - name: Lint (shellcheck)
        run: build_scripts/run_shellcheck.sh

      - name: Lint (markdown)
        run: build_scripts/run_markdownlint.sh

      - name: Test
        env:
          AGENT_TOOL_PATH: ./nora_fleet/coded_tools
          PYTHONPATH: .
        run: |
          build_scripts/server_start.sh
          pytest --verbose -m "not integration and not smoke" \
            --timer-top-n 10 -n auto --cov-config=.coveragerc --cov
